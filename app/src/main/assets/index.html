<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #182235;
            color: white;
            font-family: sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #square {
            width: 120px;
            height: 120px;
            background: #00ff88;
            border-radius: 16px;
        }
    </style>
</head>
<body>
<h2>Android WebView Test</h2>
<div id="square"></div>
<p id="status">HTML is visible</p>

<script>
    document.getElementById("status").textContent =
        "JavaScript is working";
</script>
</body>
</html>
