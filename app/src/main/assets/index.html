
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e293b;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<canvas id="gpuCanvas"></canvas>

<script>

    const canvas = document.getElementById("gpuCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 400;
    canvas.height = 400;

    ctx.fillStyle = "#00ff00";
    ctx.fillRect(0, 0, 400, 400);

    ctx.fillStyle = "#ff0000";
    ctx.beginPath();
    ctx.moveTo(200, 50);
    ctx.lineTo(50, 350);
    ctx.lineTo(350, 350);
    ctx.closePath();
    ctx.fill();

    if (window.AndroidBridge) {
        window.AndroidBridge.updateStatus(
            "Canvas 2D berhasil digambar"
        );
    }
</script>
</body>
</html>
